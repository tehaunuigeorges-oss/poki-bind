<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carte · Pokibind</title>
  <meta name="description" content="Fiche d'une carte : variantes, prix et informations.">

  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/entete.js"></script>
  <script type="module" src="js/pages/carte.js"></script>
</head>
<body data-page="carte" data-espace="membre">
  <script>try{if(localStorage.getItem("pokibind-theme")==="dark")document.body.classList.add("dark")}catch(e){}</script>
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>
  <header class="entete" id="entete"></header>

  <main class="wrap" id="contenu">
    <div class="fiche-page" id="fiche-page" aria-busy="true">
      <span class="squelette courte"></span>
      <div class="fiche">
        <div class="fiche-visuel"><span class="visuel-carte"></span></div>
        <div class="fiche-infos" aria-hidden="true">
          <span class="squelette courte"></span>
          <span class="squelette titre"></span>
          <span class="squelette"></span>
          <span class="squelette"></span>
          <span class="squelette"></span>
        </div>
      </div>
      <h1 class="sr-only">Chargement de la carte…</h1>
    </div>
    <dialog class="fenetre" id="fenetre-placer" aria-labelledby="titre-placer">
      <form class="formulaire" id="formulaire-placer" novalidate>
        <h2 id="titre-placer">Placer dans un binder</h2>
        <div id="choix-binders"></div>
        <div class="boutons">
          <button class="bouton" type="submit" id="bouton-placer">Placer la carte</button>
          <button class="bouton bouton-secondaire" type="button" id="bouton-annuler-placer">Annuler</button>
        </div>
      </form>
    </dialog>
    <dialog class="fenetre" id="fenetre-chase" aria-labelledby="titre-chase">
      <form class="formulaire" id="formulaire-chase" novalidate>
        <h2 id="titre-chase">Ajouter aux chase cards</h2>
        <p class="champ-aide" id="aide-chase"></p>
        <div class="champ-groupe">
          <label for="chase-variante">Variante cherchée</label>
          <select class="champ" id="chase-variante"></select>
        </div>
        <div class="champ-groupe">
          <label for="chase-prix-max">Ton prix maximum (€)</label>
          <input class="champ num" id="chase-prix-max" type="number" inputmode="decimal" min="0" step="0.01" aria-describedby="chase-prix-actuel erreur-prix-max">
          <p class="champ-aide" id="chase-prix-actuel"></p>
          <p class="champ-erreur" id="erreur-prix-max"></p>
        </div>
        <fieldset class="liste-choix">
          <legend class="champ-legende">Priorité</legend>
          <label class="case"><input type="radio" name="priorite" value="haute"><span>Haute</span></label>
          <label class="case"><input type="radio" name="priorite" value="moyenne" checked><span>Moyenne</span></label>
          <label class="case"><input type="radio" name="priorite" value="basse"><span>Basse</span></label>
        </fieldset>
        <div class="boutons">
          <button class="bouton" type="submit" id="bouton-chase-enregistrer">Ajouter</button>
          <button class="bouton bouton-secondaire" type="button" id="bouton-chase-annuler">Annuler</button>
        </div>
        <button class="lien lien-danger" type="button" id="bouton-chase-retirer" hidden>Retirer des chase cards</button>
      </form>
    </dialog>
    <p class="annonce" id="annonce" role="status"></p>
  </main>

  <footer class="pied" id="pied"></footer>
</body>
</html>
